name: Security Scan & Auto-Deploy

# Stage 1 of 2: main -> staging (automatic).
# push to main runs security scans, then opens + auto-merges a PR into staging.
# Stage 2 (staging -> prod) is manual and lives in promote-to-prod.yml —
# it is never triggered from here.

on:
   workflow_dispatch:
   push:
      branches:
         - main

permissions:
   contents: write
   pull-requests: write

jobs:
   security-scan:
      name: Secret & SAST Scanning
      runs-on: ubuntu-latest
      steps:
         - name: Checkout Code
           uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
           with:
              fetch-depth: 0 # Required for deep secret scanning

         - name: Run Gitleaks (Secret Scanning)
           uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
           env:
              GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

         - name: Run Semgrep (Code Vulnerabilities)
           uses: returntocorp/semgrep-action@713efdd345f3035192eaa63f56867b88e63e4e5d # v1
           with:
              config: "p/javascript"

   deploy-to-staging:
      name: PR & Auto-Merge to Staging
      needs: security-scan
      runs-on: ubuntu-latest
      steps:
         - name: Checkout Code
           uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

         - name: Create Pull Request to Staging
           id: cpr-staging
           uses: peter-evans/create-pull-request@c5a7806660adbe173f04e3e038b0ccdcd758773c # v6
           with:
              token: ${{ secrets.GITHUB_TOKEN }}
              branch: auto-deploy-main
              base: staging
              title: "🚀 Auto-Deploy: Merge main into staging"
              body: "Automated PR after passing Gitleaks and Semgrep security scans."
              delete-branch: true

         - name: Enable Auto-Merge for Staging
           if: steps.cpr-staging.outputs.pull-request-number != ''
           env:
              GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
           run: gh pr merge ${{ steps.cpr-staging.outputs.pull-request-number }} --auto --merge

   notify:
      name: Email Notification
      needs: [security-scan, deploy-to-staging]
      if: always() # Runs regardless of success or failure
      runs-on: ubuntu-latest
      steps:
         - name: Determine Pipeline Status
           id: status
           run: |
              if [ "${{ needs.security-scan.result }}" == "success" ] && [ "${{ needs.deploy-to-staging.result }}" == "success" ]; then
                echo "pipeline_status=SUCCESS" >> $GITHUB_ENV
              else
                echo "pipeline_status=FAILED" >> $GITHUB_ENV
              fi
