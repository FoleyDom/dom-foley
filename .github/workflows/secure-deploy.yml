name: Security Scan & Auto-Deploy

on:
   workflow_dispatch:
   push:
      branches:
         - main

permissions:
   contents: write
   pull-requests: write

jobs:
   security-scan:
      name: Secret & SAST Scanning
      runs-on: ubuntu-latest
      steps:
         - name: Checkout Code
           uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
           with:
              fetch-depth: 0 # Required for deep secret scanning

         - name: Run Gitleaks (Secret Scanning)
           uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
           env:
              GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

         - name: Run Semgrep (Code Vulnerabilities)
           uses: returntocorp/semgrep-action@713efdd345f3035192eaa63f56867b88e63e4e5d # v1
           with:
              config: "p/javascript"

   deploy-to-staging:
      name: PR & Auto-Merge to Staging
      needs: security-scan
      runs-on: ubuntu-latest
      steps:
         - name: Checkout Code
           uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

         - name: Create Pull Request to Staging
           id: cpr-staging
           uses: peter-evans/create-pull-request@c5a7806660adbe173f04e3e038b0ccdcd758773c # v6
           with:
              token: ${{ secrets.GITHUB_TOKEN }}
              branch: auto-deploy-main
              base: staging
              title: "🚀 Auto-Deploy: Merge main into staging"
              body: "Automated PR after passing Gitleaks and Semgrep security scans."
              delete-branch: true

         - name: Enable Auto-Merge for Staging
           if: steps.cpr-staging.outputs.pull-request-number != ''
           env:
              GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
           run: gh pr merge ${{ steps.cpr-staging.outputs.pull-request-number }} --auto --merge

   notify:
      name: Email Notification
      needs: [security-scan, deploy-to-staging]
      if: always() # Runs regardless of success or failure
      runs-on: ubuntu-latest
      steps:
         - name: Determine Pipeline Status
           id: status
           run: |
              if [ "${{ needs.security-scan.result }}" == "success" ] && [ "${{ needs.deploy-to-staging.result }}" == "success" ]; then
                echo "pipeline_status=SUCCESS" >> $GITHUB_ENV
              else
                echo "pipeline_status=FAILED" >> $GITHUB_ENV
              fi

         - name: Send Email via SMTP
           uses: dawidd6/action-send-mail@4226df7daafa6fc901a43789c49bf7ab309066e7 # v3
           with:
              server_address: smtp.gmail.com
              server_port: 465
              secure: true
              username: ${{ secrets.SMTP_USERNAME }}
              password: ${{ secrets.SMTP_PASSWORD }}
              subject: "Next.js CI/CD Pipeline ${{ env.pipeline_status }}"
              to: dfoleydev@gmail.com, domfoley.dev@gmail.com
              from: GitHub Actions Bot
              body: |
                 The GitHub Action workflow on branch 'main' has completed.

                 Overall Status: ${{ env.pipeline_status }}

                 Job Breakdown:
                 - Security Scans (Secrets & SAST): ${{ needs.security-scan.result }}
                 - PR & Auto-Merge to Staging: ${{ needs.deploy-to-staging.result }}

                 Prod promotion is a separate, manually-triggered workflow
                 ("Promote Staging to Prod") — run it from the Actions tab when ready.

                 View the full logs and details here:
                 ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
